<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light">
<title>セトリメーカー A 背骨</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800;900&family=Noto+Sans+JP:wght@500;700&family=Oswald:wght@500;700&display=swap">
<style>:root{--paper:#F4EFE6;--ink:#141414;--red:#E5361F;--ink60:rgba(20,20,20,.6);--ink30:rgba(20,20,20,.3);--ink12:rgba(20,20,20,.12);--redtint:rgba(229,54,31,.11)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#F4EFE6;--ink:#141414;--red:#E5361F}}
:root[data-theme="dark"]{--paper:#F4EFE6;--ink:#141414;--red:#E5361F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:500 15px/1.5 "Noto Sans JP",system-ui,sans-serif;overflow-x:hidden;min-width:320px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:44px;border-radius:0}
input,textarea{font:inherit;color:inherit;border-radius:0;background:transparent;border:0;outline:0}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:1px}
ol,ul{list-style:none}
svg{fill:currentColor;display:block}
.sl{display:inline-block;width:56px;height:26px;flex:none;background:repeating-linear-gradient(112deg,var(--red) 0 7px,transparent 7px 14px)}
.btn-o{border:2px solid var(--ink);font-weight:800;padding:0 14px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--paper)}
.prog{height:8px;background:var(--ink12)}
.prog i{display:block;height:100%;width:0;background:var(--red)}
#msg{font-size:13px;font-weight:700;margin-top:6px}
#msg.err{color:var(--red)}
.demo-note{font-size:13px;font-weight:700;border-left:4px solid var(--red);padding:2px 0 2px 8px;margin-top:8px}
.ic-pause{display:none}
body.playing .ic-play{display:none}
body.playing .ic-pause{display:block}
#toast{position:fixed;left:16px;right:16px;bottom:150px;background:var(--ink);color:var(--paper);padding:10px 14px;font-weight:700;font-size:14px;z-index:60;text-align:center}
#plist{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column}#plist .pb{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:3px solid var(--ink);background:var(--paper)}#plist .pb button{border:2px solid var(--ink);padding:0 12px;min-height:40px;font-weight:800;font-size:13px;background:var(--paper)}#plist-m{flex:1;font-size:12px;font-weight:700;color:var(--ink60);min-width:0}#plist-f{flex:1;width:100%;border:0}
#sheet{position:fixed;inset:0;background:rgba(20,20,20,.6);z-index:80;display:flex;align-items:flex-end}
#sheet .in{width:100%;background:var(--paper);border-top:5px solid var(--ink);padding:14px 16px 18px;max-height:92vh;overflow:auto}
#sheet .h{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:20px;margin-bottom:10px}
#sheet .h button{border:2px solid var(--ink);padding:0 14px;font-weight:800;font-size:14px}
#sheet textarea{display:block;width:100%;height:230px;border:2px solid var(--ink);padding:10px;font:500 15px/1.6 "Noto Sans JP",monospace;resize:none}
#sheet .cp{display:block;width:100%;margin-top:10px;min-height:58px;background:var(--red);color:var(--paper);font-weight:900;font-size:20px}
#sheet-msg{font-size:13px;font-weight:700;min-height:22px;margin-top:6px}
.sr{position:absolute;left:-9999px}
:root{--jk:95px;--jy:0px;--pb:15px;--cg:16px;--tcs:26px;--ts:17px;--ms:13px;--gap:5px;--my:1px;--ns:30px;--nx:-7px;--ny:-11px}
body{--hf:"M PLUS 1p","Noto Sans JP",sans-serif;--nf:"Oswald","Noto Sans JP",sans-serif;display:grid;grid-template-columns:52px 1fr;min-height:100vh}
.band{position:sticky;top:0;height:100vh;height:100svh;background:var(--paper);color:var(--ink);border-right:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0 0;overflow:hidden}
.band .lg{margin:0;line-height:0}
.band .logo{display:block;width:30px;height:auto}
.shs{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:10px}
.sh{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper)}
.sh svg{width:22px;height:22px;fill:currentColor}
.sh svg[fill=none]{fill:none}
#sh-line{background:#06C755}
.band .sl{width:100%;height:60px;flex:none;background:repeating-linear-gradient(112deg,var(--red) 0 6px,transparent 6px 14px)}
.col{padding:10px 10px 130px;min-width:0}
.frame{border:3px solid var(--ink)}
.cnt{align-self:stretch;margin-left:auto;display:flex;align-items:center;background:var(--red);color:var(--paper);font:800 18px var(--hf);padding:0 14px 0 26px;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%)}
.info{padding:10px 12px 12px;border-bottom:3px solid var(--ink)}
#ev{display:block;width:100%;font:800 20px/1.3 var(--hf);border-bottom:2px solid var(--ink);padding:4px 0;min-height:44px}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font:700 16px var(--nf);color:var(--ink60);letter-spacing:.02em}
.ld{width:100%;margin-top:8px}
.lab{display:flex;justify-content:space-between;align-items:center;height:36px;background:var(--ink);color:var(--paper);padding-left:12px;font:800 17px var(--hf)}
.lab .sl-x{width:78px;height:100%;background:repeating-linear-gradient(112deg,var(--red) 0 7px,transparent 7px 14px)}
.row{position:relative;display:grid;grid-template-columns:64px 1fr;grid-template-rows:minmax(0,1fr);border-top:2px solid var(--ink);overflow:hidden;background:var(--paper)}
.row:first-child{border-top:0}
.row.on{background:var(--redtint)}
.sp{display:block}
.row::before{content:"";position:absolute;left:32px;top:27px;width:32px;height:3px;background:var(--red)}
.row::after{content:"";position:absolute;left:26px;top:22px;width:13px;height:13px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--paper)}
.c{border-left:2px solid var(--ink);padding:6px 10px var(--pb) 12px;display:grid;grid-template-columns:minmax(0,1fr) var(--jk);grid-template-rows:auto 1fr auto;column-gap:var(--cg);min-width:0;position:relative;z-index:1}
.tcr{grid-column:1;grid-row:1}
.bt{grid-column:1;grid-row:3;min-width:0}
.tcr{display:flex;align-items:center;gap:6px}
.tc{font:700 var(--tcs)/1 var(--nf);letter-spacing:.02em;font-variant-numeric:tabular-nums;padding:0 4px 0 0;min-width:70px;text-align:left}
.row.on .tc{color:var(--red)}
.x{width:44px;height:44px;margin:-7px 0;font:700 22px/1 var(--hf);color:var(--ink60)}
.nm{display:block;width:100%;font:700 var(--ts)/1.3 "Noto Sans JP",sans-serif;padding:0;border:0}
.nm:focus{outline:0;box-shadow:0 2px 0 var(--red)}
.nm::placeholder{color:var(--ink30);font-weight:500}
.jw{grid-column:2;grid-row:1/4;align-self:end;position:relative;top:var(--jy);width:var(--jk);height:var(--jk);border:2px solid var(--ink);background:repeating-linear-gradient(112deg,var(--ink30) 0 3px,transparent 3px 9px);pointer-events:none}
.jk{display:block;width:100%;height:100%;object-fit:cover}
.jk[hidden]{display:none}
.no{position:absolute;right:var(--nx);bottom:var(--ny);font:700 var(--ns)/1 var(--nf);color:var(--red);transform:skewX(-9deg);letter-spacing:-.03em;-webkit-text-stroke:5px var(--paper);paint-order:stroke fill}
.ph{position:absolute;left:0;top:0;width:64px;height:2px;background:var(--red);display:none;z-index:2}
.ph::after{content:"";position:absolute;right:-1px;top:-7px;border:8px solid transparent;border-left:12px solid var(--red);border-right:0}
.row.on .ph{display:block}
#list{margin-bottom:0}
.bar{position:fixed;left:52px;right:0;bottom:0;background:var(--paper);border-top:3px solid var(--ink);padding:6px 10px calc(10px + env(safe-area-inset-bottom));z-index:20}
.col{padding-bottom:130px}
.sk{display:flex;align-items:center;gap:8px;font:700 14px var(--nf);font-variant-numeric:tabular-nums;margin-bottom:6px}
#sk{flex:1;min-width:0;height:44px;-webkit-appearance:none;appearance:none;background:transparent;--p:0%}
#sk::-webkit-slider-runnable-track{height:8px;background:linear-gradient(90deg,var(--red) var(--p),var(--ink30) var(--p))}
#sk::-moz-range-track{height:8px;background:linear-gradient(90deg,var(--red) var(--p),var(--ink30) var(--p))}
#sk::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:var(--red);border:3px solid var(--ink)}
#sk::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--red);border:3px solid var(--ink)}
.tr{display:flex;align-items:center;gap:8px}
.pl{width:52px;height:46px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.clk{flex:1;font:700 15px var(--nf);white-space:nowrap;min-width:0}
.spl{flex:1;border:2px solid var(--ink);padding:0 10px;white-space:nowrap;font-weight:800;font-size:15px;min-height:46px}
.sh.ex{width:44px;height:112px;background:var(--red);color:var(--paper);flex-direction:column;gap:6px}
.sh.ex span{writing-mode:vertical-rl;font:900 18px/1 var(--hf);letter-spacing:.12em}
.sh.ex::after{content:"";border-top:9px solid var(--paper);border-left:6px solid transparent;border-right:6px solid transparent}
#toast{bottom:110px}

.nmw{position:relative}
.mq{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;display:none;align-items:center;pointer-events:none;font:700 var(--ts)/1.3 "Noto Sans JP",sans-serif}
.nmw.scroll .mq{display:flex}
.nmw.scroll .nm{color:transparent}
.mt{display:inline-flex;white-space:nowrap;animation:mq 8s linear infinite}
.mt span{padding-right:2.5em}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mt{animation:none}}
.meta{margin-top:var(--gap);position:relative;top:var(--my);font:700 var(--ms)/1 "Noto Sans JP",sans-serif;color:var(--ink60);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#tune-b{position:fixed;left:4px;top:188px;width:44px;padding:0;font-size:12px !important;z-index:60;background:var(--ink);color:var(--paper);font:800 14px "Noto Sans JP",sans-serif;padding:0 14px;min-height:40px}
#tune{position:fixed;left:0;right:0;bottom:0;z-index:59;max-height:48vh;overflow:auto;background:var(--paper);border-top:3px solid var(--ink);padding:10px 14px 16px;font:700 13px "Noto Sans JP",sans-serif}
#tune[hidden]{display:none}
#tune label{display:grid;grid-template-columns:9.5em 1fr 2.6em;align-items:center;gap:8px;min-height:36px}
#tune input[type=range]{width:100%;accent-color:var(--red)}
#tune output{text-align:right;font-variant-numeric:tabular-nums}
#tune .bs{display:flex;gap:8px;margin-top:8px}
#tune .bs button{flex:1;min-height:40px;border:2px solid var(--ink);font-weight:800}
#tune textarea{width:100%;margin-top:8px;font:12px/1.4 monospace;border:2px solid var(--ink);padding:6px;background:#fff}

/* 左帯カラー3案 */
body[data-band="1"] .band{background:var(--red);color:var(--paper)}
body[data-band="1"] .band .sl{background:repeating-linear-gradient(112deg,var(--ink) 0 6px,transparent 6px 14px)}
body[data-band="1"] .sh{background:var(--paper);color:var(--red)}
body[data-band="2"] .band{background:var(--ink);color:var(--paper)}
body[data-band="2"] .band .lg{color:var(--paper)}
body[data-band="2"] .sh{background:var(--red);color:var(--paper)}
body[data-band="3"] .band{background:var(--paper);color:var(--red);border-right-color:var(--red)}
body[data-band="3"] .band .sl{background:repeating-linear-gradient(112deg,var(--ink) 0 6px,transparent 6px 14px)}
body[data-band="3"] .sh{background:var(--red);color:var(--paper)}
body[data-band] #sh-line{background:#06C755;color:#fff}
#tune .bd{display:flex;gap:8px;margin-bottom:8px}
#tune .bd button{flex:1;min-height:40px;border:2px solid var(--ink);font-weight:800}
#tune .bd button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

async function analyze(file){
  if(S.busy)return;S.busy=true;

const look=n=>{
  if(look.c[n])return look.c[n];
  return look.c[n]=fetch("https://itunes.apple.com/search?country=JP&media=music&entity=song&limit=1&term="+encodeURIComponent(n)).then(r=>r.json()).then(d=>{const r=d.results[0];return r?{img:r.artworkUrl100.replace("100x100bb","600x600bb"),artist:r.artistName,apple:r.trackViewUrl}:null}).catch(()=>null);
};look.c={};
async function plData(){
  const abs=u=>new URL(u,location.href).href;
  const segs=S.segs.map((s,i)=>({n:s.name.trim(),ms:Math.max(1,SL.end(i)-s.t)*1000})).filter(s=>s.n);
  return Promise.all(segs.map(async s=>{
    const f=await look(s.n),a=ART[s.n];
    return{n:s.n,ms:s.ms,a:(a&&a.artist)||(f&&f.artist)||"",img:a?abs(a.src):(f?f.img:""),apple:f?f.apple:"",q:s.n+((a&&a.artist)||(f&&f.artist)?" "+((a&&a.artist)||f.artist):"")};
  }));
}
function plHtml(D){
  const T=PLT,min=Math.round(D.reduce((x,s)=>x+s.ms,0)/60000);
  return '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+(S.name||"セトリ").replace(/[<&]/g,"")+' セトリ</title>'+T.font+'<style>'+T.css+'</style></head><body>'+T.body+
  '<script>const D='+JSON.stringify(D).replace(/</g,"\\u003c")+';const IC='+JSON.stringify(PLIC)+';'+T.js+
  '$("ev").textContent='+JSON.stringify(S.name||"")+';$("info").textContent="全 "+'+min+'+" 分 ／ "+N+" 曲";<\/script></body></html>';
}
let plLast="";
async function openPlaylist(){
  if(!S.segs.some(s=>s.name.trim())){SL.toast("曲名を入れると、聴けるページになります");return}
  const ov=$("plist");ov.hidden=false;$("plist-f").srcdoc="";$("plist-m").textContent="曲を探しています…";
  const D=await plData();
  plLast=plHtml(D);$("plist-f").srcdoc=plLast;$("plist-m").textContent=D.length+"曲";
}
$("plist-x").onclick=()=>{$("plist").hidden=true};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("plist").hidden=true});
$("plist-save").onclick=()=>{if(!plLast)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([plLast],{type:"text/html"}));a.download="setlist.html";document.body.append(a);a.click();a.remove()};
$("plist-cp").onclick=async()=>{try{await navigator.clipboard.writeText(txt());SL.toast("セトリをコピーしました")}catch(e){SL.toast("コピーできませんでした")}};
document.querySelectorAll("[data-export]").forEach(b=>{b.onclick=openPlaylist});

// 左帯の色（?band=1..3 か調整パネルで切替・端末に保存）
const BK="setlist-a-band";let band=new URLSearchParams(location.search).get("band");
if(!band){try{band=localStorage.getItem(BK)}catch(e){}}
const bd=el("div","bd"),bbs=[["0","白黒"],["1","朱ベタ"],["2","墨ベタ"],["3","朱線"]].map(([v,l])=>{const b=el("button",null,l);b.type="button";b.onclick=()=>setBand(v);bd.append(b);return[v,b]});
function setBand(v){v=v||"0";if(v==="0")delete document.body.dataset.band;else document.body.dataset.band=v;bbs.forEach(([k,b])=>b.setAttribute("aria-pressed",k===v));try{localStorage.setItem(BK,v)}catch(e){}}
pn.prepend(el("p",null,"左帯の色"),bd);setBand(band);
})();
</script></body></html>
